<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 週報コメント作成ツール</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .key-note {
            font-size: 12px;
            color: #868e96;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 200px;
            resize: vertical;
        }
        button {
            background-color: #20c997;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ca678;
        }
        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .clear-btn-top {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }
        .clear-btn-top:hover {
            background-color: #5a6268;
        }
        
        /* 結果ボックス＆洗練された右上固定コピーボタン */
        .result-container {
            position: relative;
            background-color: #272822;
            border-radius: 8px;
            max-height: 550px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .copy-btn-header {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: flex-end;
            padding: 10px 15px 0 0;
            z-index: 20;
            pointer-events: none; /* 下の要素のスクロールを妨げない */
        }
        .copy-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .result-box {
            color: #f8f8f2;
            padding: 5px 20px 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .error {
            color: #e03131;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading {
            color: #1c7ed6;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>📖 週報コメント作成ツール</h1>
    <div class="subtitle">ページ全体を全選択コピペ（Ctrl+A）して貼り付けるだけで、すべての質問やポイントに対するコメントと日本語訳を作成します。</div>

    <!-- APIキー入力（初回のみブラウザが記憶） -->
    <div class="card">
        <label for="apiKey">🔑 Gemini API キー：</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey()">
        <div class="key-note">※初回のみ入力が必要です。入力したキーはブラウザに安全に記憶されます。</div>
    </div>

    <div class="card">
        <button class="clear-btn-top" onclick="clearText()">🗑️ テキストを消去</button>
        <label for="inputText">📝 記事テキスト（Ctrl+A で丸ごと貼り付けOK）：</label>
        <textarea id="inputText" placeholder="Webサイトのテキストをそのまま貼り付けてください。ヘッダーやフッターなどの不要な部分は自動的に無視されます。"></textarea>
        <br><br>
        <button id="submitBtn" onclick="generateComment()">🚀 コメントを作成する</button>
        <div id="status"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <label>✨ 完成したコメント：</label>
        <div class="result-container">
            <div class="copy-btn-header">
                <button id="copyBtn" class="copy-btn" onclick="copyResult()">📋 すべてコピー</button>
            </div>
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <script>
        // ページ読み込み時に保存されたAPIキーを復元
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }
        };

        // APIキーの保存
        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("gemini_api_key", key);
        }

        // テキストエリアと結果をすべてクリアする関数
        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("status").innerHTML = "";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("inputText").focus();
        }

        // 結果をすべてコピーする関数
        function copyResult() {
            const resultTextEl = document.getElementById("resultText");
            const textToCopy = resultTextEl.innerText; // HTMLタグを除いたテキストを取得

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.textContent = "✅ コピー完了！";
                copyBtn.style.backgroundColor = "#20c997";
                copyBtn.style.borderColor = "#20c997";
                setTimeout(() => {
                    copyBtn.textContent = "📋 すべてコピー";
                    copyBtn.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
                    copyBtn.style.borderColor = "rgba(255, 255, 255, 0.25)";
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました: " + err);
            });
        }

        async function generateComment() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputText = document.getElementById("inputText").value.trim();
            const statusDiv = document.getElementById("status");
            const resultCard = document.getElementById("resultCard");
            const resultText = document.getElementById("resultText");
            const submitBtn = document.getElementById("submitBtn");

            if (!apiKey) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを入力してください。</div>';
                return;
            }
            if (!inputText) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキストを入力してください。</div>';
                return;
            }

            // 状態更新
            statusDiv.innerHTML = '<div class="loading">⏳ すべての質問・ポイントから複数の観点でコメントを作成中... 少々お待ちください。</div>';
            submitBtn.disabled = true;
            resultCard.style.display = "none";

            // システムプロンプト（質問のインドネシア語併記＆コメントごとの対出力ルール強化）
            const systemInstruction = `あなたはエホバの証人のインドネシア語会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従って回答を作成してください：

【入力テキストの取り扱い】
・入力テキストにWebサイトのヘッダー、フッター、メニュー、ナビゲーション、著作権表記などの不要な情報（ノイズ）が含まれている場合は完全に無視し、記事の本文・聖句・学習テーマに関する核心部分に注目してください。
・入力テキスト内に**複数の質問や異なる段落・テーマ**が含まれている場合は、**すべての質問やポイントを漏らさず見つけ出し、それぞれの質問・ポイントごとに**インドネシア語コメントと日本語訳を作成してください。

【出力ルール】
1. 各コメントは自然で上品、比較的簡単かつ丁寧なインドネシア語表現（エホバの証人の集会でのコメント風にし、長さは15秒前後）にする。
2. 各質問に対するコメントは異なった観点から2〜3つ書き出すこと。
3. 聖句からのコメントは、必ずどこの何章何節かを明記すること。
4. 固有名詞はエホバの証人の新世界訳聖書の表記に合わせる（例：Paulus, Filemon, Onesimus, Yehuwa, Sidang）。教会用語は使用しない。
5. 人を指す場合は orang、それ以外の事柄・方法・点は ini / hal ini / dengan cara ini を適切に使い分ける。
6. 略語（yg など）は使わず、正式な表記（yang など）にする。
7. カタカナ発音ガイドは出力しない。
8. 各質問の見出しには、必ず「インドネシア語の質問文」と「日本語訳」の両方を併記すること。
9. コメントが複数（2〜3つ）ある場合は、必ず1つのコメントごとに【インドネシア語 ➔ 日本語訳】の順番で交互に出力すること。

【出力フォーマット】
■ 【質問〇 / Pertanyaan 〇】
[ここに質問のインドネシア語文]
（[ここに質問の日本語訳]）

▼ コメント 1 / Komentar 1
■ インドネシア語
[1つ目のインドネシア語コメント]

■ 日本語訳
[1つ目の日本語訳]

▼ コメント 2 / Komentar 2
■ インドネシア語
[2つ目のインドネシア語コメント]

■ 日本語訳
[2つ目の日本語訳]

（※コメント3がある場合も同様の対形式で出力）

10. 余計な文法解説や挨拶、補足説明などは一切出力しない。`;

            const promptText = `以下のテキストに含まれるすべての質問や学習ポイントをもとに、それぞれの集会用インドネシア語コメントとその日本語訳を複数の観点から作成してください：\n\n${inputText}`;

            // Gemini API呼び出し
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    let rawOutput = data.candidates[0].content.parts[0].text;

                    // 安全なHTMLエスケープ処理
                    let htmlOutput = rawOutput
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");

                    // 質問の見出し（■ 【...】）の上に横線（<hr>）を自動で挿入し、青色で強調
                    htmlOutput = htmlOutput.replace(
                        /(■\s*【[^】]+】)/g,
                        '<hr style="border: none; border-top: 1px solid #555; margin: 25px 0 15px 0;"><div style="font-weight: bold; color: #61afef; font-size: 16px; margin-bottom: 8px;">$1</div>'
                    );

                    // コメントの見出し（▼ コメント 1 ...）の装飾
                    htmlOutput = htmlOutput.replace(
                        /(▼\s*コメント\s*\d+[^\n]*)/g,
                        '<div style="font-weight: bold; color: #abb2bf; font-size: 14px; margin-top: 15px; padding-bottom: 2px; border-bottom: 1px dashed #444;">$1</div>'
                    );

                    // インドネシア語（発表用）の見出しを緑色に装飾
                    htmlOutput = htmlOutput.replace(
                        /(■\s*インドネシア語（発表用）)/g,
                        '<div style="color: #98c379; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                    );

                    // 日本語訳（内容確認用）の見出しを黄土色に装飾
                    htmlOutput = htmlOutput.replace(
                        /(■\s*日本語訳（内容確認用）)/g,
                        '<div style="color: #e5c07b; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                    );

                    resultText.innerHTML = htmlOutput;
                    resultCard.style.display = "block";
                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
