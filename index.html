<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 週報コメント作成ツール</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .key-note {
            font-size: 12px;
            color: #868e96;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 200px;
            resize: vertical;
        }
        button {
            background-color: #20c997;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ca678;
        }
        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .clear-btn {
            background-color: #6c757d;
            margin-top: 10px;
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }
        .result-box {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            line-height: 1.6;
            margin-top: 10px;
            overflow-x: auto;
        }
        .error {
            color: #e03131;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading {
            color: #1c7ed6;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>📖 週報コメント作成ツール</h1>
    <div class="subtitle">ページ全体を全選択コピペ（Ctrl+A）して貼り付けるだけで、コメントと日本語訳を作成します。</div>

    <!-- APIキー入力（初回のみブラウザが記憶） -->
    <div class="card">
        <label for="apiKey">🔑 Gemini API キー：</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey()">
        <div class="key-note">※初回のみ入力が必要です。入力したキーはブラウザに安全に記憶されます。</div>
    </div>

    <div class="card">
        <label for="inputText">📝 記事テキスト（Ctrl+A で丸ごと貼り付けOK）：</label>
        <textarea id="inputText" placeholder="Webサイトのテキストをそのまま貼り付けてください。ヘッダーやフッターなどの不要な部分は自動的に無視されます。"></textarea>
        <br><br>
        <button id="submitBtn" onclick="generateComment()">🚀 コメントを作成する</button>
        <button class="clear-btn" onclick="clearText()">🗑️ テキストを消去</button>
        <div id="status"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <label>✨ 完成したコメント：</label>
        <div class="result-box" id="resultText"></div>
    </div>

    <script>
        // ページ読み込み時に保存されたAPIキーを復元
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }
        };

        // APIキーの保存
        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("gemini_api_key", key);
        }

        // テキストエリアと結果をすべてクリアする関数
        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("status").innerHTML = "";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("inputText").focus();
        }

        async function generateComment() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputText = document.getElementById("inputText").value.trim();
            const statusDiv = document.getElementById("status");
            const resultCard = document.getElementById("resultCard");
            const resultText = document.getElementById("resultText");
            const submitBtn = document.getElementById("submitBtn");

            if (!apiKey) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを入力してください。</div>';
                return;
            }
            if (!inputText) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキストを入力してください。</div>';
                return;
            }

            // 状態更新
            statusDiv.innerHTML = '<div class="loading">⏳ すべての質問・ポイントから複数の観点でコメントを作成中... 少々お待ちください。</div>';
            submitBtn.disabled = true;
            resultCard.style.display = "none";

            // システムプロンプト（アップデート版ルール）
            const systemInstruction = `あなたはエホバの証人のインドネシア語会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従って回答を作成してください：

【入力テキストの取り扱い】
・入力テキストにWebサイトのヘッダー、フッター、メニュー、ナビゲーション、著作権表記などの不要な情報（ノイズ）が含まれている場合は完全に無視し、記事の本文・聖句・学習テーマに関する核心部分に注目してください。
・入力テキスト内に**複数の質問や異なる段落・テーマ**が含まれている場合は、**すべての質問やポイントを漏らさず見つけ出し、それぞれの質問・ポイントごとに**インドネシア語コメントと日本語訳を作成してください。

【出力ルール】
1. 各コメントは自然で上品、比較的簡単かつ丁寧なインドネシア語表現（エホバの証人の集会でのコメント風にし、長さは15秒前後）にする。各質問に対するコメントは異なった観点から2-3つ書き出すこと。
2. 聖句からのコメントは、必ずどこの何章何節かを明記すること。
3. 固有名詞はエホバの証人の新世界訳聖書の表記に合わせる（例：Paulus, Filemon, Onesimus, Yehuwa, Sidang）。教会用語は使用しない。
4. 人を指す場合は orang、それ以外の事柄・方法・点は ini / hal ini / dengan cara ini を適切に使い分ける。
5. 略語（yg など）は使わず、正式な表記（yang など）にする。
6. カタカナ発音ガイドは出力しない。
7. 出力は、見つかった質問・ポイントごとに以下の形式を繰り返して提示する：
   ■ 【質問・テーマ〇についてのコメント】
   ■ インドネシア語（発表用）
   [ここにインドネシア語本文]

   ■ 日本語訳（内容確認用）
   [ここに日本語訳]

8. 余計な文法解説や挨拶、補足説明などは一切出力しない。`;

            const promptText = `以下のテキストに含まれるすべての質問や学習ポイントをもとに、それぞれの集会用インドネシア語コメントとその日本語訳を複数の観点から作成してください：\n\n${inputText}`;

            // Gemini API呼び出し
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    const output = data.candidates[0].content.parts[0].text;
                    resultText.textContent = output;
                    resultCard.style.display = "block";
                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
