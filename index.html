    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 4px 10px;
            background-color: #f8f9fa;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"], input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 8px;
            background-color: #fff;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 100px;
            resize: vertical;
        }
        
        /* 下段のボタン群：4つの等分グリッド */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button, .btn-group .image-input-btn, .btn-group .pdf-input-btn {
            border: none;
            padding: 12px 4px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            width: 100%;
        }
        .btn-primary {
            background-color: #20c997;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0ca678;
        }
        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .image-input-btn, .pdf-input-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
        }
        .image-input-btn:hover, .pdf-input-btn:hover {
            background-color: #dee2e6;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }

        /* プレビュー領域 */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
