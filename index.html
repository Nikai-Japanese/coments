<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マル秘ツール</title>
    <!-- タブの一番左に㊙️アイコンを表示 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>㊙️</text></svg>">
    
    <!-- PDF.js ライブラリ (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 4px 10px;
            background-color: #f8f9fa;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 100px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        button, .image-input-btn, .pdf-input-btn {
            border: none;
            padding: 12px 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn-primary {
            background-color: #20c997;
            color: white;
            flex: 1.5; /* 一番左: GO! */
        }
        .btn-primary:hover {
            background-color: #0ca678;
        }
        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .image-input-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            flex: 1.2; /* 画像選択 */
        }
        .image-input-btn:hover {
            background-color: #dee2e6;
        }
        .pdf-input-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            flex: 1.2; /* PDF選択 */
        }
        .pdf-input-btn:hover {
            background-color: #dee2e6;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
            flex: 1; /* 一番右: 消去 */
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }

        /* 画像プレビュー領域のスタイル */
        .image-preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .image-preview-container > * {
            flex: 1;
        }
        .image-preview {
            width: 100%;
            max-height: 80px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ced4da;
        }
        .remove-img-btn {
            background-color: #e03131;
            color: white;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remove-img-btn:hover {
            background-color: #c92a2a;
        }

        /* PDFプレビュー領域のスタイル */
        .pdf-preview-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #e7f5ff;
            border: 1px solid #a5d8ff;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #1864ab;
        }
        .pdf-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .remove-pdf-btn {
            background-color: #e03131;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }
        .remove-pdf-btn:hover {
            background-color: #c92a2a;
        }

        /* 結果ボックス＆右上固定コピーボタン */
        .result-container {
            position: relative;
            background-color: #272822;
            border-radius: 8px;
            max-height: 550px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .copy-btn-header {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: flex-end;
            padding: 10px 15px 0 0;
            z-index: 20;
            pointer-events: none;
        }
        .copy-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .result-box {
            color: #f8f8f2;
            padding: 5px 20px 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .error {
            color: #e03131;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading {
            color: #1c7ed6;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- APIキー入力 -->
    <div class="card" style="padding: 12px 20px;">
        <button type="button" onclick="toggleApiKey()" style="background: transparent; color: #495057; border: 1px dashed #ced4da; padding: 8px 12px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
            <span>🔑 Gemini APIキー設定</span>
            <span id="apiToggleArrow">▼</span>
        </button>
        <div id="apiKeyContent" style="display: none; margin-top: 12px;">
            <label for="apiKey">Gemini API</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey()">
        </div>
    </div>

    <!-- テキスト入力カード -->
    <div class="card">
        <!-- 選択画像プレビュー領域（画像選択時のみ表示） -->
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="imagePreview" class="image-preview" src="" alt="プレビュー">
            <button type="button" class="remove-img-btn" onclick="removeImage()">❌ 画像削除</button>
        </div>

        <!-- 選択PDF表示領域（PDF選択時のみ表示） -->
        <div id="pdfPreviewContainer" class="pdf-preview-container" style="display: none;">
            <div class="pdf-info">
                <span>📄</span>
                <span id="pdfNameText">ファイル名.pdf</span>
                <span id="pdfPageText" style="font-weight: normal; opacity: 0.8;">(全 0 ページ)</span>
            </div>
            <button type="button" class="remove-pdf-btn" onclick="removePdf()">❌ PDF削除</button>
        </div>

        <textarea id="inputText" placeholder=""></textarea>
        
        <!-- ボタン群（左：GO、2番目：画像、3番目：PDF、右：消去） -->
        <div class="btn-group">
            <button id="submitBtn" class="btn-primary" onclick="generateComment()">GO!</button>
            
            <label class="image-input-btn" for="imageInput">
                📷 画像を選択
            </label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            
            <label class="pdf-input-btn" for="pdfInput">
                📄 PDFを選択
            </label>
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handlePdfSelect(event)">
            
            <button class="clear-btn" onclick="clearText()">消去</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- 結果表示カード -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="result-container">
            <div class="copy-btn-header">
                <button id="copyBtn" class="copy-btn" onclick="copyResult()">COPY</button>
            </div>
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <script>
        // PDF.js ワーカーの指定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let selectedBase64Image = null;
        let selectedMimeType = null;
        let extractedPdfText = "";

        // ページ読み込み時に保存されたAPIキーを復元
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }
        };

        // APIキーの開閉切り替え
        function toggleApiKey() {
            const content = document.getElementById("apiKeyContent");
            const arrow = document.getElementById("apiToggleArrow");
            if (content.style.display === "none") {
                content.style.display = "block";
                arrow.textContent = "▲";
            } else {
                content.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        // APIキーの保存
        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("gemini_api_key", key);
        }

        // 画像選択処理
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedMimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                selectedBase64Image = dataUrl.split(',')[1]; // Base64純粋データ部分を取得
                
                document.getElementById("imagePreview").src = dataUrl;
                document.getElementById("imagePreviewContainer").style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        // 画像削除処理
        function removeImage() {
            selectedBase64Image = null;
            selectedMimeType = null;
            document.getElementById("imageInput").value = "";
            document.getElementById("imagePreview").src = "";
            document.getElementById("imagePreviewContainer").style.display = "none";
        }

        // PDF選択処理
        async function handlePdfSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = '<div class="loading">📄 PDFを読み込み中...</div>';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let pdfFullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tokenized = await page.getTextContent();
                    const pageText = tokenized.items.map(item => item.str).join(" ");
                    pdfFullText += `\n--- [PDF Page ${i}] ---\n` + pageText;
                }

                extractedPdfText = pdfFullText.trim();

                document.getElementById("pdfNameText").textContent = file.name;
                document.getElementById("pdfPageText").textContent = `(全 ${pdf.numPages} ページ)`;
                document.getElementById("pdfPreviewContainer").style.display = "flex";
                statusDiv.innerHTML = "";
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ PDFの解析に失敗しました: ${err.message}</div>`;
                removePdf();
            }
        }

        // PDF削除処理
        function removePdf() {
            extractedPdfText = "";
            document.getElementById("pdfInput").value = "";
            document.getElementById("pdfNameText").textContent = "";
            document.getElementById("pdfPageText").textContent = "";
            document.getElementById("pdfPreviewContainer").style.display = "none";
        }

        // テキストエリアと結果をすべてクリアする関数
        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("status").innerHTML = "";
            document.getElementById("resultCard").style.display = "none";
            removeImage();
            removePdf();
            document.getElementById("inputText").focus();
        }

        // 結果をすべてコピーする関数
        function copyResult() {
            const resultTextEl = document.getElementById("resultText");
            const textToCopy = resultTextEl.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.textContent = "✅ コピー完了！";
                copyBtn.style.backgroundColor = "#20c997";
                copyBtn.style.borderColor = "#20c997";
                setTimeout(() => {
                    copyBtn.textContent = "📋 すべてコピー";
                    copyBtn.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
                    copyBtn.style.borderColor = "rgba(255, 255, 255, 0.25)";
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました: " + err);
            });
        }

        async function generateComment() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputText = document.getElementById("inputText").value.trim();
            const statusDiv = document.getElementById("status");
            const resultCard = document.getElementById("resultCard");
            const resultText = document.getElementById("resultText");
            const submitBtn = document.getElementById("submitBtn");

            // 入力テキスト、PDF抽出テキストを統合
            let combinedContent = "";
            if (inputText) {
                combinedContent += inputText;
            }
            if (extractedPdfText) {
                if (combinedContent) combinedContent += "\n\n";
                combinedContent += "【PDFから抽出した本文】:\n" + extractedPdfText;
            }

            if (!apiKey) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを入力してください。</div>';
                return;
            }
            if (!combinedContent && !selectedBase64Image) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキスト、PDF、または画像を入力してください。</div>';
                return;
            }

            // 状態更新
            statusDiv.innerHTML = '<div class="loading">作成中...</div>';
            submitBtn.disabled = true;
            resultCard.style.display = "none";

            // システムプロンプト
            const systemInstruction = `あなたはエホバの証人のインドネシア語会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従って回答を作成してください：

【入力テキスト・画像の取り扱い】
・入力テキストや画像にWebサイトのヘッダー、フッター、メニュー、ナビゲーション、著作権表記などの不要な情報（ノイズ）が含まれている場合は完全に無視し、記事の本文・聖句・学習テーマ・挿絵や図表に関する核心部分に注目してください。
・最初のパート「HARTA DALAM FIRMAN ALLAH」の最初の10分の話については答える必要はありません。完全に無視してください。コメントの作成対象は「2. Permata Rohani」以下のセクションのみです。
・「2. Permata Rohani」の質問「Dari pembacaan Alkitab minggu ini, permata rohani apa yang mau Saudara bagikan?」については、その週の聖書通読範囲内の各章ごとに（例：[Pasal 45]、[Pasal 46]など）見出しを立て、何章何節から引用したかを明記した上で、霊的な宝石（コメントと日本語訳）を作成してください。
・「2. Permata Rohani」以下のテキスト内に**複数の質問や異なる段落・テーマ**が含まれている場合は、**すべての質問やポイントを漏らさず見つけ出し、それぞれの質問・ポイントごとに**インドネシア語コメントと日本語訳を作成してください。
・画像が添付されている場合、画像内の挿絵やイラストがどの質問・段落（Pasal/Paragraf/Pertanyaan）と関連しているか、あるいはその挿絵自体についての質問（例：「挿絵にはどのような様子が描かれていますか」など）かを正確に認識し、**必ずその該当する質問の見出しの直下に、画像から学べる教訓（Pelajaran dari gambar）としてコメントと日本語訳を出力してください。**

【出力ルール】
1. 各コメントは、初心者でも分かりやすい簡単な言葉を使用し、簡潔なインドネシア語表現（エホバの証人の集会でのコメント風にし、長さは15秒前後）にする。
2. 各質問に対するコメントは異なった観点から2〜3つ書き出すこと。
3. 聖句からのコメントは、必ずどこの何章何節かを明記すること。
4. 固有名詞はエホバの証人の新世界訳聖書の表記に合わせる（例：Paulus, Filemon, Onesimus, Yehuwa, Sidang）。教会用語は使用しない。
5. 人を指す場合は orang、それ以外の事柄・方法・点は ini / hal ini / dengan cara ini を適切に使い分ける。
6. 略語（yg など）は使わず、正式な表記（yang など）にする。
7. カタカナ発音ガイドは出力しない。
8. 各質問の見出しには、必ず「インドネシア語の質問文」と「日本語訳」の両方を併記すること。
9. コメントが複数（2〜3つ）ある場合は、必ず1つのコメントごとに【インドネシア語 ➔ 日本語訳】の順番で交互に出力すること。
10. **【重要・区切り線】異なる質問の間、および異なるコメントの間には、必ず見やすいようにダッシュ線（例: -------------------------------------）を挿入して、どこで区切られているかをテキスト上で明確にすること。**

【出力フォーマット例】
-----------------------------------
■ 【質問〇 / Pertanyaan 〇】
[ここに質問のインドネシア語文]
（[ここに質問の日本語訳]）

▼ コメント 1 / Komentar 1
■ インドネシア語
[1つ目のインドネシア語コメント]

■ 日本語訳
[1つ目の日本語訳]

--------------------------------------------------
▼ コメント 2 / Komentar 2
■ インドネシア語
[2つ目のインドネシア語コメント]

■ 日本語訳
[2つ目の日本語訳]

11. 余計な文法解説や挨拶、補足説明などは一切出力しない。`;

            const promptText = `以下のテキストおよび画像に含まれる「2. Permata Rohani」以降のすべての質問や学習ポイントをもとに、それぞれの該当する質問や段落の場所で、挿絵の教訓も含めた集会用インドネシア語コメントとその日本語訳を複数の観点から作成してください。必ずダッシュ線で区切って出力してください：\n\n${combinedContent}`;

            // リクエストパーツの構築（テキスト ＋ 画像）
            const parts = [{ text: promptText }];
            if (selectedBase64Image) {
                parts.unshift({
                    inlineData: {
                        mimeType: selectedMimeType,
                        data: selectedBase64Image
                    }
                });
            }

            // Gemini API呼び出し (gemini-3.8-flash)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: parts
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    let rawOutput = data.candidates[0].content.parts[0].text;

                    // 安全なHTMLエスケープ処理
                    let htmlOutput = rawOutput
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");

                    // 質問の見出し（■ 【...】）を青色で強調
                    htmlOutput = htmlOutput.replace(
                        /(■\s*【[^】]+】)/g,
                        '<div style="font-weight: bold; color: #61afef; font-size: 16px; margin-bottom: 8px;">$1</div>'
                    );

                    // コメントの見出し（▼ コメント 1 ...）の装飾
                    htmlOutput = htmlOutput.replace(
                        /(▼\s*コメント\s*\d+[^\n]*)/g,
                        '<div style="font-weight: bold; color: #abb2bf; font-size: 14px; margin-top: 15px; padding-bottom: 2px; border-bottom: 1px dashed #444;">$1</div>'
                    );

                    // インドネシア語の見出しを緑色に装飾
                    htmlOutput = htmlOutput.replace(
                        /(■\s*インドネシア語)/g,
                        '<div style="color: #98c379; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                    );

                    // 日本語訳の見出しを黄土色に装飾
                    htmlOutput = htmlOutput.replace(
                        /(■\s*日本語訳)/g,
                        '<div style="color: #e5c07b; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                    );

                    resultText.innerHTML = htmlOutput;
                    resultCard.style.display = "block";
                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
