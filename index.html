<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マル秘ツール</title>
    <!-- タブの一番左に㊙️アイコンを表示 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>㊙️</text></svg>">
    <!-- PDF.js CDN読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 4px 10px;
            background-color: #f8f9fa;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 100px;
            resize: vertical;
        }
       
        /* 下段のボタン群：4つの等分グリッド（上下の幅を完全に同期） */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button, .btn-group .image-input-btn, .btn-group .pdf-input-btn {
            border: none;
            padding: 12px 4px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            width: 100%;
        }
        .btn-primary {
            background-color: #20c997;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0ca678;
        }
        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .image-input-btn, .pdf-input-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
        }
        .image-input-btn:hover, .pdf-input-btn:hover {
            background-color: #dee2e6;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }

        /* プレビュー領域：下段と同じ4列グリッドにして境界線を完璧に一致させる */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
       
        /* 画像プレビュー：左側の2カラム分（GO!と画像の幅）を使用 */
        .image-preview {
            width: 100%;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            grid-column: span 2;
        }
       
        /* PDF表示領域：左側の2カラム分を使用 */
        .pdf-badge {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            height: 42px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #495057;
            font-size: 13px;
            text-align: center;
            word-break: break-all;
            box-sizing: border-box;
            grid-column: span 2;
        }

        /* 削除ボタン：右側の2カラム分（PDFと消去の幅）を使用 */
        .remove-btn {
            background-color: #e03131;
            color: white;
            padding: 0 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            height: 42px;
            box-sizing: border-box;
            grid-column: span 2;
            transition: background-color 0.2s;
        }
        .remove-btn:hover {
            background-color: #c92a2a;
        }

        /* 個別セクション用コピーボタン */
        .copy-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .error {
            color: #e03131;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading {
            color: #1c7ed6;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- APIキー入力 -->
    <div class="card" style="padding: 12px 20px;">
        <button type="button" onclick="toggleApiKey()" style="background: transparent; color: #495057; border: 1px dashed #ced4da; padding: 8px 12px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
            <span>🔑 Gemini APIキー設定</span>
            <span id="apiToggleArrow">▼</span>
        </button>
        <div id="apiKeyContent" style="display: none; margin-top: 12px;">
            <label for="apiKey">Gemini API</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey()">
        </div>
    </div>

    <!-- テキスト入力カード -->
    <div class="card">
        <!-- 出力言語設定（選択式：指定の6言語） -->
        <div style="margin-bottom: 12px;">
            <label for="targetLanguage" style="font-size: 13px; margin-bottom: 4px;">🗣️ 作成・出力言語（会衆の言語）</label>
            <select id="targetLanguage">
                <option value="インドネシア語" selected>インドネシア語</option>
                <option value="中国語（簡体字）">中国語（簡体字）</option>
                <option value="英語">英語</option>
                <option value="タガログ語">タガログ語</option>
                <option value="ベトナム語">ベトナム語</option>
                <option value="日本語">日本語</option>
            </select>
        </div>

        <!-- 選択画像プレビュー領域 -->
        <div id="imagePreviewContainer" class="preview-container" style="display: none;">
            <img id="imagePreview" class="image-preview" src="" alt="プレビュー">
            <button type="button" class="remove-btn" onclick="removeImage()">❌ 画像削除</button>
        </div>

        <!-- 選択PDFプレビュー領域 -->
        <div id="pdfPreviewContainer" class="preview-container" style="display: none;">
            <div id="pdfBadge" class="pdf-badge">📄 PDF読み込み済み</div>
            <button type="button" class="remove-btn" onclick="removePdf()">❌ PDF削除</button>
        </div>

        <textarea id="inputText" placeholder=""></textarea>
       
        <!-- ボタン群（4つ均等：GO、画像選択、PDF選択、消去） -->
        <div class="btn-group">
            <button id="submitBtn" class="btn-primary" onclick="generateComment()">GO!</button>
           
            <label class="image-input-btn" for="imageInput">📷 画像</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
           
            <label class="pdf-input-btn" for="pdfInput">📄 PDF</label>
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handlePdfSelect(event)">
           
            <button class="clear-btn" onclick="clearText()">消去</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- 結果表示コンテナ -->
    <div id="resultsContainer" style="display: none;"></div>

    <script>
        let selectedBase64Image = null;
        let selectedMimeType = null;
        let extractedPdfText = "";

        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }
        };

        function toggleApiKey() {
            const content = document.getElementById("apiKeyContent");
            const arrow = document.getElementById("apiToggleArrow");
            if (content.style.display === "none") {
                content.style.display = "block";
                arrow.textContent = "▲";
            } else {
                content.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("gemini_api_key", key);
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedMimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                selectedBase64Image = dataUrl.split(',')[1];
               
                document.getElementById("imagePreview").src = dataUrl;
                document.getElementById("imagePreviewContainer").style.display = "grid";
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedBase64Image = null;
            selectedMimeType = null;
            document.getElementById("imageInput").value = "";
            document.getElementById("imagePreview").src = "";
            document.getElementById("imagePreviewContainer").style.display = "none";
        }

        async function handlePdfSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = '<div class="loading">PDFを解析中...</div>';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
               
                let fullText = "";
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += `--- Page ${i} ---\n` + pageText + "\n";
                }

                extractedPdfText = fullText;
                document.getElementById("pdfBadge").textContent = `📄 ${file.name} (${pdfDoc.numPages}ページ)`;
                document.getElementById("pdfPreviewContainer").style.display = "grid";
                statusDiv.innerHTML = "";
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ PDFの解析に失敗しました: ${err.message}</div>`;
                document.getElementById("pdfInput").value = "";
            }
        }

        function removePdf() {
            extractedPdfText = "";
            document.getElementById("pdfInput").value = "";
            document.getElementById("pdfPreviewContainer").style.display = "none";
        }

        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("status").innerHTML = "";
            const resultsContainer = document.getElementById("resultsContainer");
            resultsContainer.style.display = "none";
            resultsContainer.innerHTML = "";
            document.getElementById("submitBtn").disabled = false;
            removeImage();
            removePdf();
            document.getElementById("inputText").focus();
        }

        function copySectionText(buttonEl) {
            const sectionCard = buttonEl.closest('.card');
            const textContentEl = sectionCard.querySelector('.result-box-content');
            const textToCopy = textContentEl.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                buttonEl.textContent = "✅ コピー完了！";
                buttonEl.style.backgroundColor = "#20c997";
                buttonEl.style.borderColor = "#20c997";
                setTimeout(() => {
                    buttonEl.textContent = "📋 このセクションをコピー";
                    buttonEl.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
                    buttonEl.style.borderColor = "rgba(255, 255, 255, 0.25)";
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました: " + err);
            });
        }

        async function generateComment() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputText = document.getElementById("inputText").value.trim();
            const targetLang = document.getElementById("targetLanguage").value;
            const statusDiv = document.getElementById("status");
            const resultsContainer = document.getElementById("resultsContainer");
            const submitBtn = document.getElementById("submitBtn");

            if (!apiKey) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを入力してください。</div>';
                return;
            }
            if (!inputText && !selectedBase64Image && !extractedPdfText) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキスト、画像、またはPDFを入力してください。</div>';
                return;
            }

            statusDiv.innerHTML = '<div class="loading">作成中...</div>';
            submitBtn.disabled = true;
            resultsContainer.style.display = "none";
            resultsContainer.innerHTML = "";

            const systemInstruction = `あなたはエホバの証人の${targetLang}会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従ってノートを作成してください：

【🚨 ファイルの整合性チェック（最重要）】
- もし「PDF」と「画像」の両方が同時にアップロードされている場合、PDFのテキスト内容と画像に描かれている内容が同じ範囲・同じ週のものとして一致しているかを最初に厳密に確認してください。
- 一致していない場合は出力の最初に必ず「⚠️ PDFと画像の内容が一致していません！同じ範囲のファイルをアップロードしてください。」という警告文のみを出力して処理を終了してください。

【重要：言語および文字の指定】
- 出力言語として「中国語（簡体字）」が選択されている場合は、繁体字を一切使用せず、必ず中国本土の簡体字のみを使用してください。

【出力構造と区切りのルール（最重要）】
1. Webサイトのヘッダーや不要なノイズは無視してください。最初の10分の話は完全に無視してください。
2. 「2. Permata Rohani」以下の聖書通読範囲のコメントを出力する際、**「各章ごとに含まれるすべての質問とそれに対するコメント」を1つのまとまりとして完全にグループ化し、章ごとに分割**してください。
3. 異なる章の間には、必ず「===CHAPTER_DIVIDER===」という特定の区切り文字を挿入してください（※通常の質問同士の細かいダッシュ線とは明確に区別してください）。
4. 各コメントは初心者でも分かりやすい簡単な言葉を使用し、${targetLang}表現（15秒前後）にする。異なった観点から2〜3つ書き出すこと。
5. コメントが複数ある場合は、1つのコメントごとに【■ ${targetLang} ➔ ■ 日本語訳】の順番で交互に出力すること。
6. 余計な挨拶や補足説明などは一切出力しない。`;

            let combinedInput = inputText;
            if (extractedPdfText) {
                combinedInput = "--- 【PDF抽出テキスト】 ---\n" + extractedPdfText + "\n\n--- 【追加ユーザーテキスト】 ---\n" + inputText;
            }

            const promptText = `以下のテキストおよび画像をもとに、元の教材テキスト文面をすべて維持しながら、それぞれの該当する質問の直下に${targetLang}のコメントと日本語訳を埋め込んでください。特に聖書通読範囲の「章ごとのすべての質問・コメント」のまとまりの間には、必ず「===CHAPTER_DIVIDER===」を入れて章ごとに明確に区切ってください：\n\n${combinedInput}`;

            const parts = [{ text: promptText }];
            if (selectedBase64Image) {
                parts.unshift({
                    inlineData: {
                        mimeType: selectedMimeType,
                        data: selectedBase64Image
                    }
                });
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: parts
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    let rawOutput = data.candidates[0].content.parts[0].text;

                    // 章の区切り（===CHAPTER_DIVIDER===）ごとに分割
                    const rawSections = rawOutput.split(/===CHAPTER_DIVIDER===/).filter(sec => sec.trim().length > 0);

                    resultsContainer.style.display = "block";

                    rawSections.forEach((sectionText) => {
                        let htmlOutput = sectionText
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;");

                        // 質問の見出し
                        htmlOutput = htmlOutput.replace(
                            /(■\s*【[^】]+】)/g,
                            '<div style="font-weight: bold; color: #61afef; font-size: 16px; margin-top: 15px; margin-bottom: 8px;">$1</div>'
                        );

                        // コメントの見出し
                        htmlOutput = htmlOutput.replace(
                            /(▼\s*コメント\s*\d+[^\n]*)/g,
                            '<div style="font-weight: bold; color: #abb2bf; font-size: 14px; margin-top: 15px; padding-bottom: 2px; border-bottom: 1px dashed #444;">$1</div>'
                        );

                        // 対象言語の見出し
                        htmlOutput = htmlOutput.replace(
                            /(■\s*(?:インドネシア語|中国語（簡体字）|英語|タガログ語|ベトナム語|日本語|[^<>\n]+))/g,
                            function(match) {
                                if (match.includes("JP") || match.includes("日本語訳")) return match;
                                return '<div style="color: #98c379; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">' + match + '</div>';
                            }
                        );

                        // 日本語訳の見出し
                        htmlOutput = htmlOutput.replace(
                            /(■\s*(?:JP|日本語訳))/g,
                            '<div style="color: #e5c07b; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                        );

                        // 章ごとに1つのカード（ボックス）を生成
                        const sectionCard = document.createElement("div");
                        sectionCard.className = "card";
                        sectionCard.style.cssText = "background-color: #272822; color: #f8f8f2; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.08);";
                        
                        sectionCard.innerHTML = `
                            <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                                <button class="copy-btn" onclick="copySectionText(this)">📋 この章をすべてコピー</button>
                            </div>
                            <div class="result-box-content" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.6; white-space: pre-wrap;">${htmlOutput}</div>
                        `;

                        resultsContainer.appendChild(sectionCard);
                    });

                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
