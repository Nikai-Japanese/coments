<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マル秘ツール</title>
    <!-- タブの一番左に㊙️アイコンを表示 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>㊙️</text></svg>">
    <!-- PDF.js CDN読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 4px 10px;
            background-color: #f8f9fa;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            height: 100px;
            resize: vertical;
        }
        
        /* 下段のボタン群：5つに対応（GO、画像、PDF、動画、消去） */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .btn-group button, .btn-group .image-input-btn, .btn-group .pdf-input-btn, .btn-group .video-input-btn {
            height: 42px;
            border: none;
            padding: 0 2px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            width: 100%;
        }
        .btn-primary {
            background-color: #20c997;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0ca678;
        }
        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
        .image-input-btn, .pdf-input-btn, .video-input-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
        }
        .image-input-btn:hover, .pdf-input-btn:hover, .video-input-btn:hover {
            background-color: #dee2e6;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }

        /* プレビュー領域：グリッド */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        
        /* 画像プレビュー：左側2カラム */
        .image-preview {
            width: 100%;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            grid-column: span 2;
        }
        
        /* PDF・動画バッジ表示領域：左側2カラム */
        .file-badge {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            height: 42px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #495057;
            font-size: 13px;
            text-align: center;
            word-break: break-all;
            box-sizing: border-box;
            grid-column: span 2;
        }

        /* 削除ボタン：右側2カラム */
        .remove-btn {
            background-color: #e03131;
            color: white;
            padding: 0 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            height: 42px;
            box-sizing: border-box;
            grid-column: span 2;
            transition: background-color 0.2s;
        }
        .remove-btn:hover {
            background-color: #c92a2a;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .error {
            color: #e03131;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading {
            color: #1c7ed6;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- APIキー入力 -->
    <div class="card" style="padding: 12px 20px;">
        <button type="button" onclick="toggleApiKey()" style="background: transparent; color: #495057; border: 1px dashed #ced4da; padding: 8px 12px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
            <span>🔑 Gemini APIキー設定</span>
            <span id="apiToggleArrow">▼</span>
        </button>
        <div id="apiKeyContent" style="display: none; margin-top: 12px;">
            <label for="apiKey">Gemini API</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="saveApiKey()">
        </div>
    </div>

    <!-- テキスト入力カード -->
    <div class="card">
        <!-- 出力言語設定 ＆ 経過時間表示（同じ行の一番右に配置） -->
        <div style="margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <label for="targetLanguage" style="font-size: 13px; margin-bottom: 0;">🗣️ 作成・出力言語（会衆の言語）</label>
                <span id="timerDisplay" style="font-size: 13px; font-weight: bold; color: #1c7ed6;">⏱️ 0分0秒</span>
            </div>
            <select id="targetLanguage">
                <option value="インドネシア語" selected>インドネシア語</option>
                <option value="中国語（簡体字）">中国語（簡体字）</option>
                <option value="英語">英語</option>
                <option value="タガログ語">タガログ語</option>
                <option value="ベトナム語">ベトナム語</option>
                <option value="日本語">日本語</option>
            </select>
        </div>

        <!-- 画像プレビュー領域 -->
        <div id="imagePreviewContainer" class="preview-container" style="display: none;">
            <img id="imagePreview" class="image-preview" src="" alt="プレビュー">
            <button type="button" class="remove-btn" onclick="removeImage()">❌ 画像削除</button>
        </div>

        <!-- PDFプレビュー領域 -->
        <div id="pdfPreviewContainer" class="preview-container" style="display: none;">
            <div id="pdfBadge" class="file-badge">📄 PDF読み込み済み</div>
            <button type="button" class="remove-btn" onclick="removePdf()">❌ PDF削除</button>
        </div>

        <!-- 動画プレビュー領域 -->
        <div id="videoPreviewContainer" class="preview-container" style="display: none;">
            <div id="videoBadge" class="file-badge">🎬 動画読み込み済み</div>
            <button type="button" class="remove-btn" onclick="removeVideo()">❌ 動画削除</button>
        </div>

        <textarea id="inputText" placeholder="※スクショ画像コピー (Shift+ctrl+cmd+4)；貼り付け (Cmd+V）"></textarea>
        
        <!-- ボタン群（5つ均等：GO、画像、PDF、動画、消去） -->
        <div class="btn-group">
            <button id="submitBtn" class="btn-primary" onclick="generateComment()">GO!</button>
           
            <label class="image-input-btn" for="imageInput">📷 画像</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
           
            <label class="pdf-input-btn" for="pdfInput">📄 PDF</label>
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handlePdfSelect(event)">

            <label class="video-input-btn" for="videoInput">🎬 動画</label>
            <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="handleVideoSelect(event)">
           
            <button class="clear-btn" onclick="clearText()">消去</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- 結果表示コンテナ -->
    <div id="resultsContainer" style="display: none;"></div>

    <script>
        let selectedBase64Image = null;
        let selectedMimeType = null;
        let extractedPdfText = "";
        let selectedBase64Video = null;
        let selectedVideoMimeType = null;
        let selectedVideoName = "";
        let timerInterval = null;

        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }

            // ページ全体でのクリップボードからの貼り付け（ペースト）イベントを監視
            window.addEventListener('paste', function(event) {
                const items = (event.clipboardData || event.originalEvent.clipboardData).items;
                for (let index in items) {
                    const item = items[index];
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const blob = item.getAsFile();
                        processImageFile(blob);
                        event.preventDefault();
                        break;
                    }
                }
            });
        };

        function toggleApiKey() {
            const content = document.getElementById("apiKeyContent");
            const arrow = document.getElementById("apiToggleArrow");
            if (content.style.display === "none") {
                content.style.display = "block";
                arrow.textContent = "▲";
            } else {
                content.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("gemini_api_key", key);
        }

        function processImageFile(file) {
            if (!file) return;
            selectedMimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                selectedBase64Image = dataUrl.split(',')[1];
                document.getElementById("imagePreview").src = dataUrl;
                document.getElementById("imagePreviewContainer").style.display = "grid";
            };
            reader.readAsDataURL(file);
        }

        function handleImageSelect(event) {
            processImageFile(event.target.files[0]);
        }

        function removeImage() {
            selectedBase64Image = null;
            selectedMimeType = null;
            document.getElementById("imageInput").value = "";
            document.getElementById("imagePreview").src = "";
            document.getElementById("imagePreviewContainer").style.display = "none";
        }

        async function handlePdfSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = '<div class="loading">PDFを解析中...</div>';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
               
                let fullText = "";
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += `--- Page ${i} ---\n` + pageText + "\n";
                }

                extractedPdfText = fullText;
                document.getElementById("pdfBadge").textContent = `📄 ${file.name} (${pdfDoc.numPages}ページ)`;
                document.getElementById("pdfPreviewContainer").style.display = "grid";
                statusDiv.innerHTML = "";
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ PDFの解析に失敗しました: ${err.message}</div>`;
                document.getElementById("pdfInput").value = "";
            }
        }

        function removePdf() {
            extractedPdfText = "";
            document.getElementById("pdfInput").value = "";
            document.getElementById("pdfPreviewContainer").style.display = "none";
        }

        function handleVideoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 20 * 1024 * 1024) {
                alert("⚠️ 動画ファイルが大きすぎます（20MB以下を推奨します）。短いクリップや圧縮された動画をご利用ください。");
            }

            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = '<div class="loading">動画を読み込み中...</div>';

            selectedVideoMimeType = file.type || "video/mp4";
            selectedVideoName = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                selectedBase64Video = dataUrl.split(',')[1];
                document.getElementById("videoBadge").textContent = `🎬 ${file.name}`;
                document.getElementById("videoPreviewContainer").style.display = "grid";
                statusDiv.innerHTML = "";
            };
            reader.onerror = function(err) {
                statusDiv.innerHTML = `<div class="error">❌ 動画の読み込みに失敗しました。</div>`;
                document.getElementById("videoInput").value = "";
            };
            reader.readAsDataURL(file);
        }

        function removeVideo() {
            selectedBase64Video = null;
            selectedVideoMimeType = null;
            selectedVideoName = "";
            document.getElementById("videoInput").value = "";
            document.getElementById("videoPreviewContainer").style.display = "none";
        }

        function clearText() {
            document.getElementById("inputText").value = "";
            document.getElementById("status").innerHTML = "";
            const resultsContainer = document.getElementById("resultsContainer");
            resultsContainer.style.display = "none";
            resultsContainer.innerHTML = "";
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("timerDisplay").textContent = "⏱️ 0分0秒";
            if (timerInterval) clearInterval(timerInterval);
            removeImage();
            removePdf();
            removeVideo();
            document.getElementById("inputText").focus();
        }

        function copyQuestionCard(buttonEl) {
            const cardEl = buttonEl.closest('.card');
            const contentEl = cardEl.querySelector('.result-box');
            const textToCopy = contentEl.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                buttonEl.textContent = "✅ コピー完了！";
                buttonEl.style.backgroundColor = "#20c997";
                buttonEl.style.borderColor = "#20c997";
                setTimeout(() => {
                    buttonEl.textContent = "📋 この質問をすべてコピー";
                    buttonEl.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
                    buttonEl.style.borderColor = "rgba(255, 255, 255, 0.25)";
                }, 2000);
            }).catch(err => {
                alert("コピーに失敗しました: " + err);
            });
        }

        async function generateComment() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputText = document.getElementById("inputText").value.trim();
            const targetLang = document.getElementById("targetLanguage").value;
            const statusDiv = document.getElementById("status");
            const resultsContainer = document.getElementById("resultsContainer");
            const submitBtn = document.getElementById("submitBtn");
            const timerDisplay = document.getElementById("timerDisplay");

            if (!apiKey) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを入力してください。</div>';
                return;
            }
            if (!inputText && !selectedBase64Image && !extractedPdfText && !selectedBase64Video) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキスト、画像、PDF、または動画を入力してください。</div>';
                return;
            }

            statusDiv.innerHTML = '<div class="loading">動画とテキストを分析・作成中...（少し時間がかかります）</div>';
            submitBtn.disabled = true;
            resultsContainer.style.display = "none";
            resultsContainer.innerHTML = "";

            // タイマー開始
            const startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsedSeconds / 60);
                const seconds = elapsedSeconds % 60;
                timerDisplay.textContent = `⏱️ ${minutes}分${seconds}秒`;
            }, 1000);

            const systemInstruction = `あなたはエホバの証人の${targetLang}会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従ってノートを作成してください：

【🚨 ファイルの整合性チェック（最重要）】
- アップロードされたテキスト、画像、PDF、動画の内容やテーマが同じ範囲・同じ週のものとして一致しているかを確認してください。

【重要：言語および文字の指定】
- 出力言語として「中国語（簡体字）」が選択されている場合は、繁体字を一切使用せず、必ず中国本土の簡体字のみを使用して出力してください。

【入力テキスト・画像・PDF・動画の取り扱いと埋め込み出力】
・Webサイトのヘッダー、フッター、メニュー、著作権表記などの不要なノイズは完全に無視してください。
・動画が含まれている場合、動画内で話されている内容、映像表現、インタビューや実演のポイントをしっかり読み取り、コメントの内容に反映させてください。
・「2. Permata Rohani」以下のセクションについて、元の教材のテキスト・質問文を漏れなくそのまま順序通りに出力してください。
・各質問文の直下に、作成したコメント（${targetLang}＋日本語訳）を埋め込んで配置してください。

【出力ルール】
1. 各コメントは、初心者でも分かりやすい簡単な言葉を使用し、簡潔な${targetLang}表現（15秒前後）にする。
2. **各質問に対するコメントは異なった観点から必ず2〜3つ書き出すこと。**
3. 聖句からのコメントは、必ずどこの何章何節かを明記すること。
4. 固有名詞はエホバの証人の新世界訳聖書の表記に合わせる。教会用語は使用しない。
5. 略語は使わず、正式な表記にする。
6. カタカナ発音ガイドは出力しない。
7. 各質問の見出しには、必ず「元の言語の質問文」と「日本語訳」の両方を併記すること。
8. コメントが複数ある場合は、必ず1つのコメントごとに【■ ${targetLang} ➔ ■ 日本語訳】の順番で交互に出力すること。
9. **【重要・質問ごとの区切り】異なる質問の間には、必ず「===QUESTION_DIVIDER===」という特定の区切り文字を挿入してください。これにより、1つの質問とそれに対する複数のコメント候補が1つのまとまりとしてグループ化されるようにしてください。**
10. 余計な文法解説や挨拶、補足説明などは一切出力しない。`;

            let combinedInput = inputText;
            if (extractedPdfText) {
                combinedInput = "--- 【PDF抽出テキスト】 ---\n" + extractedPdfText + "\n\n--- 【追加ユーザーテキスト】 ---\n" + inputText;
            }

            const promptText = `以下のテキスト、PDF、画像、および動画に含まれるすべての質問や学習ポイント、動画の内容をもとに、それぞれの該当する質問の直下に${targetLang}の集会用コメント（2〜3つの候補）とその日本語訳を埋め込んでください。**異なる質問の間には必ず「===QUESTION_DIVIDER===」を挿入してください**：\n\n${combinedInput}`;

            const parts = [{ text: promptText }];
            
            if (selectedBase64Video) {
                parts.unshift({
                    inlineData: {
                        mimeType: selectedVideoMimeType,
                        data: selectedBase64Video
                    }
                });
            }
            if (selectedBase64Image) {
                parts.unshift({
                    inlineData: {
                        mimeType: selectedMimeType,
                        data: selectedBase64Image
                    }
                });
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: parts
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                // 処理完了（成功・失敗問わずタイマー停止）
                if (timerInterval) clearInterval(timerInterval);

                if (response.ok) {
                    let rawOutput = data.candidates[0].content.parts[0].text;

                    const questionBlocks = rawOutput.split(/===QUESTION_DIVIDER===/).filter(block => block.trim().length > 0);

                    resultsContainer.style.display = "block";

                    questionBlocks.forEach((blockText) => {
                        let htmlOutput = blockText
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;");

                        htmlOutput = htmlOutput.replace(
                            /(■\s*【[^】]+】)/g,
                            '<div style="font-weight: bold; color: #61afef; font-size: 16px; margin-top: 5px; margin-bottom: 8px;">$1</div>'
                        );

                        htmlOutput = htmlOutput.replace(
                            /(▼\s*コメント\s*\d+[^\n]*)/g,
                            '<div style="font-weight: bold; color: #abb2bf; font-size: 14px; margin-top: 15px; padding-bottom: 2px; border-bottom: 1px dashed #444;">$1</div>'
                        );

                        htmlOutput = htmlOutput.replace(
                            /(■\s*(?:インドネシア語|中国語（簡体字）|英語|タガログ語|ベトナム語|日本語|[^<>\n]+))/g,
                            function(match) {
                                if (match.includes("JP") || match.includes("日本語訳")) return match;
                                return '<div style="color: #98c379; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">' + match + '</div>';
                            }
                        );

                        htmlOutput = htmlOutput.replace(
                            /(■\s*(?:JP|日本語訳))/g,
                            '<div style="color: #e5c07b; font-weight: bold; margin-top: 10px; margin-bottom: 4px;">$1</div>'
                        );

                        const questionCard = document.createElement("div");
                        questionCard.className = "card";
                        questionCard.style.cssText = "background-color: #272822; color: #f8f8f2; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.08);";
                        
                        questionCard.innerHTML = `
                            <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                                <button class="copy-btn" onclick="copyQuestionCard(this)">📋 この質問をすべてコピー</button>
                            </div>
                            <div class="result-box" style="padding: 5px 0 0 0;">${htmlOutput}</div>
                        `;

                        resultsContainer.appendChild(questionCard);
                    });

                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                if (timerInterval) clearInterval(timerInterval);
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
