13 YOSUA

Dia Menaati Perintah yang Terdengar Aneh
Edisi Tercetak
YOSUA memandang ke arah Yerikho, kota yang harus dia serang dan hancurkan sesuai perintah Allah. Dia mungkin teringat kata-kata Yehuwa kepadanya sebelum Musa meninggal: ”Kamu harus berani dan kuat.” (Ul. 31:23) Belum lama ini, Yehuwa berkata lagi kepadanya, ”Kamu harus berani dan sangat kuat.” (Yos. 1:7) Kenapa Yosua butuh banyak keberanian?

Yerikho adalah kota pertama di Kanaan, atau Negeri Perjanjian, yang harus dikalahkan bangsa Israel. Meski Yerikho tidak terlalu besar, kota itu dibentengi tembok-tembok yang kuat. Di balik tembok itu, penduduknya melakukan berbagai hal yang sangat bejat. Ratusan tahun sebelumnya, Yehuwa pernah berbicara kepada Abraham tentang ”kesalahan orang Amori”, yang memaksudkan semua orang di negeri Kanaan. Yehuwa mengatakan bahwa suatu saat, kebejatan orang-orang itu akan ”mencapai puncaknya”, dan akhirnya mereka akan dihukum. (Kej. 15:16) Sekaranglah waktu yang Yehuwa maksudkan. Orang Kanaan menyembah berhala, menjadi pelacur kuil, dan bahkan mengorbankan anak mereka kepada dewa-dewi yang kejam! Mereka juga berhubungan seks dengan sesama jenis, keluarga dekat, dan binatang. Karena begitu bejatnya orang Kanaan, negeri yang mereka tinggali seolah-olah tidak tahan lagi dan mau memuntahkan mereka! (Im. 18:​3, 6, 21-27) Apa maksudnya?

Yosua diperintahkan Yehuwa untuk menyerang kota berbenteng dengan strategi yang kelihatannya tidak masuk akal

Yehuwa akan menyingkirkan orang jahat dari negeri Kanaan, mulai dari kota Yerikho. Untuk itu, Allah menggunakan Yosua dan pasukannya. Mereka semua siap menaati perintah Yehuwa. Tapi, perintah yang Yehuwa berikan kepada Yosua terdengar aneh. Mereka tidak diminta untuk langsung menyerang kota itu atau mengepungnya untuk waktu yang lama. Tapi, mereka hanya perlu berbaris mengelilingi kota itu satu kali sehari selama enam hari. Para imam juga harus ikut, sebagian sambil mengangkat tabut perjanjian dan sebagian lagi sambil meniup trompet tanduk. Pada hari ketujuh, mereka semua harus mengelilingi kota itu tujuh kali, lalu para prajurit harus berteriak.

Pria-pria Kanaan yang siap berperang berdiri di atas tembok kota Yerikho. Dengan cemas, mereka mengamati orang Israel yang berbaris mengelilingi kota.
Sebenarnya, Yosua adalah prajurit yang berpengalaman. Dia bisa saja berpikir bahwa strategi perang itu sangat aneh. Lagi pula, bagaimana kalau bangsa Israel kalah melawan Yerikho? Bisa-bisa, orang Kanaan di semua kota lainnya jadi berani menyerang mereka.

Meski begitu, Yehuwa sudah memberi Yosua banyak alasan untuk percaya kepada-Nya. Misalnya, waktu Yosua mengutus dua mata-mata ke Yerikho, mereka diberi tahu bahwa penduduk Yerikho takut kepada orang Israel. Yehuwa juga sudah menghentikan aliran Sungai Yordan secara mukjizat sehingga bangsa Israel bisa menyeberanginya.

Yosua pasti merenungkan hal-hal itu. Imannya menjadi semakin kuat, dan dia pun berani menaati Yehuwa. Dia memimpin pasukannya untuk berbaris mengelilingi kota Yerikho, dan para imam ikut sambil meniup trompet. Sementara itu, ”pintu gerbang Yerikho ditutup rapat”, dan tidak seorang pun keluar dari situ. Besoknya, Yosua melakukan hal yang sama, persis seperti yang Yehuwa perintahkan. Mereka terus melakukannya selama enam hari berturut-turut. Lalu, tibalah hari ketujuh.

Kali ini, pasukan Yosua mengelilingi kota Yerikho tujuh kali. Akhirnya, setelah putaran ketujuh, Yosua memerintahkan para prajurit, ”Berteriaklah, karena Yehuwa sudah menyerahkan kota itu kepada kalian!” Segera setelah mereka menyerukan teriakan perang, ”tembok kota itu pun roboh hingga rata dengan tanah”.

Yosua dan pasukannya langsung masuk ke kota itu dan memusnahkan semua yang hidup, persis seperti yang Yehuwa perintahkan. Dengan bantuan Yehuwa, mereka mengalahkan kota demi kota dan bangsa demi bangsa. Akhirnya, Yehuwa membersihkan negeri Kanaan dari ”kesalahan orang Amori” yang bejat!

Tapi, ada sebagian kecil dari tembok kota Yerikho yang tidak roboh. Kenapa? Jawabannya berkaitan dengan iman dan keberanian seorang wanita di kota itu. Kisahnya akan dibahas di bab berikutnya.

    <h1>📖 週報コメント作成ツール</h1>
    <div class="subtitle">ページ全体を全選択コピペ（Ctrl+A）して貼り付けるだけで、すべての質問やポイントに対するコメントと日本語訳を作成します。</div>

    <div class="card">
        <label for="inputText">📝 記事テキスト（Ctrl+A で丸ごと貼り付けOK）：</label>
        <textarea id="inputText" placeholder="Webサイトのテキストをそのまま貼り付けてください。ヘッダーやフッターなどの不要な部分は自動的に無視されます。"></textarea>
        <br><br>
        <button id="submitBtn" onclick="generateComment()">🚀 コメントを作成する</button>
        <div id="status"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <label>✨ 完成したコメント（すべての質問分）：</label>
        <div class="result-box" id="resultText"></div>
    </div>

    <script>
        // ★APIキー設定★
        const API_KEY = "AIzaSyD44U96p5LDERiSEF8bEmCVmaIU8kuPDLk";

        async function generateComment() {
            const inputText = document.getElementById("inputText").value.trim();
            const statusDiv = document.getElementById("status");
            const resultCard = document.getElementById("resultCard");
            const resultText = document.getElementById("resultText");
            const submitBtn = document.getElementById("submitBtn");

            if (!API_KEY || API_KEY.includes("ここに")) {
                statusDiv.innerHTML = '<div class="error">⚠️ APIキーを正しく設定してください。</div>';
                return;
            }
            if (!inputText) {
                statusDiv.innerHTML = '<div class="error">⚠️ テキストを入力してください。</div>';
                return;
            }

            // 状態更新
            statusDiv.innerHTML = '<div class="loading">⏳ すべての質問・ポイントからコメントを作成中... 少々お待ちください。</div>';
            submitBtn.disabled = true;
            resultCard.style.display = "none";

            // システムプロンプト（複数質問への完全対応ルール）
            const systemInstruction = `あなたはエホバの証人のインドネシア語会衆で発表する日本人奉仕者のための優秀なアシスタントです。
以下のルールに厳密に従って回答を作成してください：

【入力テキストの取り扱い】
・入力テキストにWebサイトのヘッダー、フッター、メニュー、ナビゲーション、著作権表記などの不要な情報（ノイズ）が含まれている場合は完全に無視し、記事の本文・聖句・学習テーマに関する核心部分に注目してください。
・入力テキスト内に**複数の質問や異なる段落・テーマ**が含まれている場合は、**すべての質問やポイントを漏らさず見つけ出し、それぞれの質問・ポイントごとに**インドネシア語コメントと日本語訳を作成してください。

【出力ルール】
1. 各コメントは自然で上品、比較的簡単かつ丁寧なインドネシア語表現（エホバの証人の集会でのコメント風にし、長さは15秒前後）にする。
2. 固有名詞はエホバの証人の新世界訳聖書の表記に合わせる（例：Paulus, Filemon, Onesimus, Yehuwa, Sidang）。教会用語は使用しない。
3. 人を指す場合は orang、それ以外の事柄・方法・点は ini / hal ini / dengan cara ini を適切に使い分ける。
4. 略語（yg など）は使わず、正式な表記（yang など）にする。
5. カタカナ発音ガイドは出力しない。
6. 出力は、見つかった質問・ポイントごとに以下の形式を繰り返して提示する：

   ■ 【質問・テーマ〇についてのコメント】
   ■ インドネシア語（発表用）
   [ここにインドネシア語本文]

   ■ 日本語訳（内容確認用）
   [ここに日本語訳]

7. 余計な文法解説や挨拶、補足説明などは一切出力しない。`;

            const promptText = `以下のテキストに含まれるすべての質問や学習ポイントをもとに、それぞれの集会用インドネシア語コメントとその日本語訳を作成してください：\n\n${inputText}`;

            // Gemini API呼び出し
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`;

            const requestBody = {
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                },
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    const output = data.candidates[0].content.parts[0].text;
                    resultText.textContent = output;
                    resultCard.style.display = "block";
                    statusDiv.innerHTML = "";
                } else {
                    statusDiv.innerHTML = `<div class="error">❌ エラーが発生しました: ${data.error.message}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="error">❌ 通信エラーが発生しました: ${err.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
